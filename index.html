<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coin Win Myanmar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card" id="authCard">
      <h1>🪙 Coin Win Myanmar</h1>
      <p class="muted">Demo Website</p>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <div class="row">
        <button id="loginBtn">Login</button>
        <button id="signupBtn" class="secondary">Register</button>
      </div>
      <p id="authMsg" class="msg"></p>
    </section>

    <section id="app" hidden>
      <header class="top">
        <div>
          <h1>🪙 Coin Win Myanmar</h1>
          <p id="userEmail" class="muted"></p>
        </div>
        <button id="logoutBtn" class="secondary small">Logout</button>
      </header>

      <section class="balance card">
        <span>Coin Balance</span>
        <strong id="balance">0</strong>
        <span>Coins</span>
      </section>

      <section class="card">
        <h2>🎯 Tasks</h2>
        <div id="tasks"></div>
      </section>

      <section class="card">
        <h2>💳 Withdrawal Demo</h2>
        <p class="muted">ဒီနေရာမှာ withdrawal request ကို စမ်းသပ်နိုင်ပါတယ်။</p>
        <input id="withdrawAmount" type="number" min="1" placeholder="Coin amount">
        <select id="paymentMethod">
          <option>Wave Money</option>
          <option>KBZPay</option>
          <option>KBZPay Bank</option>
        </select>
        <input id="paymentAccount" placeholder="Demo account / phone">
        <button id="withdrawBtn">Request Withdrawal</button>
        <p id="withdrawMsg" class="msg"></p>
      </section>

     <section class="card">
  <h2>📋 Withdrawal History</h2>
  <div id="withdrawals"></div>
</section>

<section class="card">
  <h2>📜 Transactions</h2>
  <div id="transactions"></div>
</section>

<section class="card" id="adminCard" hidden>
  <h2>👑 Admin Panel</h2>

  <h3>➕ Add Task</h3>

<input id="taskTitle" type="text" placeholder="Task title">
<input id="taskReward" type="number" placeholder="Reward Coins">

<button onclick="addTask()">Add Task</button>

<p id="taskMsg" class="muted"></p>

<hr>

<h3>👥 Referral Bonus</h3>

<input id="referralBonus" type="number" placeholder="Referral Bonus Coins">

<button onclick="saveReferralBonus()">Save Referral Bonus</button>

<p id="referralMsg" class="muted"></p>

<hr>

<h3>🎯 Task Management</h3>
<div id="adminTasks"></div>

<hr>

<h3>💳 Withdrawal Requests</h3>
<div id="adminWithdrawals"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
